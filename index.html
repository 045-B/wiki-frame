<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="위키 문서처럼 편집하고 고해상도 PNG로 저장하는 이미지 편집기">
  <title>WIKI FRAME — 위키 이미지 편집기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/TetraTheta/RIDIBatang-subset/dist/style/RIDIBatang-subset-web.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=wiki-frame-13">
</head>
<body>
  <header class="studio-bar">
    <button class="mobile-toggle" id="mobileToggle" aria-expanded="false">☰ 설정</button>
    <div><strong>WIKI FRAME</strong><span>위키 이미지 편집기</span></div>
    <p>텍스트와 이미지를 편집한 뒤 한 장으로 저장하세요.</p>
    <div class="studio-actions"><button id="resetButton">초기화</button><button class="save" id="saveButton">PNG 저장</button></div>
  </header>

  <div class="workspace">
    <aside class="editor" id="editorPanel">
      <div class="editor-heading"><div><span>DOCUMENT SETTINGS</span><h1>문서 편집</h1></div><button class="mobile-close" id="mobileClose" aria-label="설정 닫기">×</button></div>
      <details open><summary><b>01</b> 기본 설정</summary><div class="fields">
        <label>포인트 색상<input type="color" id="accentInput"></label>
        <label>문서 배경색<input type="color" id="paperInput"></label>
        <label>폰트<select id="fontInput"><option value="pretendard">Pretendard</option><option value="noto">Noto Sans KR</option><option value="ridi">리디바탕</option><option value="galmuri">Galmuri</option></select></label>
        <label>왼쪽 상단 위키 이름<textarea class="line" id="brandInput" rows="1"></textarea></label>
        <label>문서 제목<textarea class="line" id="titleInput" rows="1"></textarea></label>
        <label>부제목<textarea class="line" id="subtitleInput" rows="1"></textarea></label>
        <label>목차 제목<textarea class="line" id="tocTitleInput" rows="1"></textarea></label>
      </div></details>
      <details open><summary><b>02</b> 정보상자</summary><div class="fields">
        <label class="upload">대표 이미지<input type="file" id="profileUpload" accept="image/*"><span>이미지 선택</span></label>
        <label>표제<textarea class="line" id="infoNameInput" rows="1"></textarea></label>
        <div id="infoRowEditorList"></div>
        <button class="add-section" id="addInfoRowButton" type="button">＋ 대표 정보 항목 추가</button>
      </div></details>
      <details open><summary><b>03</b> 개요</summary><div class="fields">
        <label class="upload">본문 이미지 여러 장<input type="file" id="bodyUpload" accept="image/*" multiple><span>이미지 선택 · 여러 장 가능</span></label>
        <div id="bodyImageEditorList"></div>
        <div id="overviewEditor"></div>
      </div></details>
      <details open><summary><b>04</b> 추가 본문</summary><div class="fields">
        <div id="sectionEditorList"></div>
        <button class="add-section" id="addSectionButton" type="button">＋ 본문 상자 추가</button>
      </div></details>
      <div class="image-help"><strong>이미지 조정</strong><p id="imageStatus">이미지를 선택하세요 · 드래그 이동 · 휠 확대/축소 · 방향키 미세조정</p></div>
    </aside>
    <button class="editor-backdrop" id="editorBackdrop" aria-label="설정 닫기"></button>

    <main class="stage">
      <div class="stage-note"><span>LIVE PREVIEW</span><p>이미지를 클릭한 뒤 직접 위치와 크기를 조절할 수 있습니다.</p></div>
      <div class="sheet-frame">
        <article class="wiki-sheet" id="wikiSheet">
          <header class="wiki-topbar">
            <div class="wiki-brand"><strong data-brand></strong></div>
            <nav><span>최근 변경</span><span>최근 토론</span><b>⋮</b></nav>
            <div class="wiki-search">문서 검색 <span>⌕</span></div>
          </header>
          <div class="wiki-layout">
            <div class="wiki-document">
              <div class="document-path"><span data-brand></span> / 문서</div>
              <div class="document-head"><div><h1 id="titleView"></h1><p id="subtitleView"></p></div><div class="document-tools"><span>★</span><span>역사</span><span>편집</span></div></div>
              <section class="summary-layout">
                <div class="lead-copy summary-copy">
                  <nav class="contents-box"><strong id="tocTitleView"></strong><ol id="tocList"></ol></nav>
                </div>
                <aside class="info-box">
                  <h2 id="infoNameView"></h2>
                  <div class="image-slot profile-slot" data-image-slot="profile"><span>대표 이미지</span></div>
                  <dl id="infoRowsList"></dl>
                </aside>
              </section>

              <div id="sectionList"></div>
              <footer><span>이 문서는 사용자가 직접 만든 이미지 문서입니다.</span><b data-brand></b></footer>
            </div>
          </div>
        </article>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="app.js?v=wiki-frame-9"></script>
</body>
</html>
